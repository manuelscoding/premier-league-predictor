name: Refresh player market values

# Player market values don't move fast enough to need the nightly cadence
# the rest of the data gets — twice a year (roughly aligned with the summer
# and winter transfer windows closing) is plenty.
on:
  schedule:
    - cron: "0 3 1 1,7 *"  # 03:00 UTC on Jan 1 and Jul 1
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: pip install pandas requests

      - name: Fetch current market values
        working-directory: src
        run: python fetch_market_values.py

      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/player_market_values.csv
          git diff --cached --quiet || git commit -m "Refresh player market values"
          git push
